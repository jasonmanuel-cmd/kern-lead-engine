[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kern-lead-engine"
version = "0.1.0"
description = "Kern County public-record real-estate lead pipeline"
requires-python = ">=3.11"

[project.scripts]
kern-leads = "kern_leads.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
